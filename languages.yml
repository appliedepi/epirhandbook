# The one language list for the handbook. The CI workflow, build_all_chapters.sh,
# inject_language_links.R and the checks under checks/ all read this file.
# Nothing else declares which languages ship.
#
# code   the folder content/<code>/, and the site path /<code>/
# label  the display text in the language switcher on every page
# title  the book title, the same string as content/<code>/_quarto.yaml book.title
main: en
languages:
  - code: en
    label: "English"
    title: "The Epidemiologist R Handbook"
  - code: fr
    label: "Français"
    title: "Le Epi R Handbook"
  - code: es
    label: "Español"
    title: "EpiRhandbook en español"
  - code: vn
    label: "Tiếng Việt"
    title: "Cẩm nang dịch tễ học với R"
  - code: jp
    label: "日本"
    title: "疫学のための R ハンドブック"
  - code: pt
    label: "Português"
    title: "Manual de R para Epidemiologistas"
  - code: tr
    label: "Türkçe"
    title: "Epidemiyologun R Rehberi"
  - code: ru
    label: "Русский"
    title: "Справочник эпидемиолога R"
