name: Promote to Production
on:
  release:
    types: [published]
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch latest staging
        run: git fetch origin
      - name: Promote staging to production
        run: git push origin origin/staging:refs/heads/production --force
