name: Deploy to Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
# One run per pull request, newest push wins. Different PRs share the
# deploy-preview group inside build-deploy.yml, and there the newest run
# cancels the older one, its translation sync check included.
# The name MUST differ from that group: a caller and a called workflow in groups
# of the same name cancel each other.
concurrency:
  group: preview-caller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # build-deploy.yml runs the translation sync check itself, beside the
  # render, and deploys only when it passes.
  build-deploy:
    uses: ./.github/workflows/build-deploy.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      branch: preview
    secrets: inherit
    permissions:
      contents: write
      # the called workflow pulls render images from GHCR; a reusable
      # workflow cannot request MORE than its caller grants
      packages: read
