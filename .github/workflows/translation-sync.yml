name: Translation sync check
# Runs checks/check-sync.sh --base <commit>, which runs the checks below. The job fails when
# any of them fails, check 4 aside:
#   1, 2, 3   structure, anchors and chunk code against the English
#   4         inline code spans that the English lacks (informational, so it never fails)
#   5, 7, 9   internal links, chunks that read data/, and the layout
#   10        unparsed links, and the self-test of check 10
#   11, 14    image names, and image versions in prose
#   12, 21    clean failure and message counts, which test the checks themselves
#   15        the landing page
#   16, 19    English parse, and suggested packages
#   20, 22    grid tables, and lowercase names
#   23        interface strings
#   24, 26    translation rules and raw HTML, each with its self-test
#   27, 28    parity and markdown form, each with its self-test
#   25, 29    the self-tests of the rendered-table and rendered-structure checks. The checks
#             themselves read site/, so build-deploy.yml runs them.
#   6, 8      the two gates that need the base commit, over the files changed since it:
#             quarto render --no-execute on each changed translated chapter, and the R
#             parse gate on each chunk of those chapters.
# Read-only. Runs in the epirhandbook-checks image. What each check means and how to repair
# drift: checks/README.md.
#
# build-deploy.yml calls this workflow on the commit it builds, beside the render, and
# its deploy job needs it. So a commit that fails here is never deployed. A called
# workflow sees the event of its top-level caller, so the base commit below still comes
# from the push or the pull_request event.
on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to check. The caller passes the commit it builds."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to diff against for checks 6 and 8. Empty means the root commit (whole tree)."
        required: false
        default: ""
jobs:
  check-sync:
    runs-on: ubuntu-latest
    # The job installs nothing, so the install hang of 2026-10-23 cannot recur.
    # Check 6 renders every translated chapter the diff changed, so the job's
    # length grows with the diff: 4 to 6 minutes on typical runs, and still
    # rendering at the old 20-minute limit on a pull request that changed most
    # chapter files.
    timeout-minutes: 40
    # Every tool the checks call is in this image, so the job installs nothing:
    # git, python3 with PyYAML, Quarto 1.9.38, and R 4.6.0 with knitr and
    # rmarkdown. Check 8 parses chunks with R. Check 6 renders with quarto
    # --no-execute, and quarto's knitr engine still loads knitr and rmarkdown.
    # The checks call pandoc through `quarto pandoc`. The image is built in
    # appliedepi/aedockerpublic, epirhandbook/2.9/checks/Dockerfile.
    container: ghcr.io/appliedepi/aedockerpublic/epirhandbook-checks:2.9
    # In a container job a run step without a shell runs under sh, and the
    # base-commit step needs bash for `set -o pipefail`.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Major tag, never a SHA. See the note at the top of build-deploy.yml.
        uses: actions/checkout@v4
        with:
          # The caller's commit. Empty under workflow_dispatch, which checks out the
          # commit of the dispatch.
          ref: ${{ inputs.ref }}
          # Checks 6 and 8 read the diff against a base commit, so they need the history.
          fetch-depth: 0
      - name: Trust the workspace for git
        # The workspace belongs to the runner's user and the container runs as
        # root, so git refuses the repository as "dubious ownership". Checkout
        # trusts it only while checkout runs. The steps below run git too.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Work out the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ github.event.inputs.base }}
        run: |
          set -uo pipefail
          root=$(git rev-list --max-parents=0 HEAD | tail -1)
          zero=0000000000000000000000000000000000000000
          usable() {
            [ -n "${1:-}" ] && [ "$1" != "$zero" ] \
              && git cat-file -e "$1^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$1" HEAD
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual run names its own base, or gets the whole tree.
            if usable "${DISPATCH_BASE:-}"; then
              base="$DISPATCH_BASE"; why="the base given to workflow_dispatch"
            else
              base="$root"; why="the root commit, because workflow_dispatch gave no usable base"
            fi
          elif [ "$EVENT" = "pull_request" ]; then
            # On a pull request origin/main is the target branch, not this head, so merge-base
            # gives the fork point. That is the right fallback here and only here.
            # preview.yml passes the PR head, not the merge commit. When main moved after the
            # fork, PR_BASE is not an ancestor of that head, and merge-base gives the base.
            if usable "${PR_BASE:-}"; then
              base="$PR_BASE"; why="the pull_request event's base commit"
            elif git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main \
                 && mb=$(git merge-base origin/main HEAD 2>/dev/null) && [ -n "$mb" ]; then
              base="$mb"; why="git merge-base origin/main HEAD"
            else
              base="$root"; why="the root commit"
            fi
          else
            # On a push to main origin/main is this same commit, so merge-base returns HEAD and
            # checks 6 and 8 would see an empty changed set. Fall back to the whole tree instead.
            if usable "${PUSH_BEFORE:-}"; then
              base="$PUSH_BEFORE"; why="the push event's before commit"
            else
              base="$root"; why="the root commit, because the push event carried no usable before commit"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "checks 6 and 8 run against $base ($why)"
      - name: Check the translations against the English
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: checks/check-sync.sh --base "$BASE"
