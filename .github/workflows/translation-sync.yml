name: Translation sync check
# Fails when a translated chapter drifts from the English in structure:
# a missing chapter, a different code-chunk count, a different heading sequence,
# a heading without the English anchor id, or a chunk whose code differs.
# Read-only, python3 and git only, about a minute. What each check means and how to
# repair drift: modernization/SYNC-CHECKS.md.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  check-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the translations against the English
        run: modernization/check-sync.sh
