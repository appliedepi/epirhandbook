name: Translation sync check
# Fails when a translated chapter drifts from the English in structure:
# a missing chapter, a different code-chunk count, a different heading sequence,
# a heading without the English anchor id, a chunk whose code differs, or a dead
# internal link.
# Read-only, python3, git and pandoc only, about two minutes. What each check means and
# how to repair drift: checks/README.md.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  check-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Check the translations against the English
        run: checks/check-sync.sh
