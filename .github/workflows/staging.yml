name: Deploy to Staging
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-deploy:
    uses: ./.github/workflows/build-deploy.yml
    with:
      ref: main
      branch: staging
    secrets: inherit
    permissions:
      contents: write
      # the called workflow pulls render images from GHCR; a reusable
      # workflow cannot request MORE than its caller grants
      packages: read
