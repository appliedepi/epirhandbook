# landing.yml: every string the landing hero and the nonprofit band show.
#
# One block per language code, the same codes languages.yml declares.
# utils/landing-hero.R reads this file and builds the markup. The markup lives in
# that one file, so all eight landing pages render the same structure.
#
# A key a language does not declare falls back to the `en` value. A new language
# therefore shows English text, never an empty box and never NA. To translate a
# string, add the key to that language's block. Only `en` declares any string
# today, so all eight heroes read in English.
#
# Three values are NOT here, because each already has one home:
#   the hero title      languages.yml, `title`, one per language
#   the chapter count   content/<main>/_quarto.yaml, `book.chapters`
#   the language count  languages.yml
# A second copy of any of them is the thing that drifts.
#
# A value is an HTML fragment, not plain text. It may carry <b> or <a>, and it
# MUST use double quotes on every attribute. The language-switcher injector
# re-serialises each page with xml2::write_html(), and a single-quoted image
# path escapes the path rewriter in .github/workflows/build-deploy.yml.

en:
  eyebrow: "Applied Epi · Technical partners for public health"
  subtitle: "A free, community-written R reference for applied epidemiology and public health. Task-centered code you can use online or offline."
  search_placeholder: "Search the handbook"
  search_label: "Search the handbook"
  btn_start: "Start reading"
  btn_start_href: "basics.html"
  btn_offline: "Download the offline version"
  btn_offline_href: "data_used.html"
  stat_used_num: "3 million+"
  stat_used_label: "times"
  stat_chapters_label: "chapters"
  stat_languages_label: "languages"
  np_brand: "Applied Epi"
  np_lead: "{brand} is a global nonprofit (501(c)(3)) and grassroots movement of frontline epidemiologists from around the world. Our team helps public health workers and agencies build their R skills."
  np_trust: "Our intro R course is trusted by the <b>US CDC</b>, the <b>WHO</b>, and <b>400+</b> other health agencies and Field Epidemiology Training Programs worldwide."
  svc:
    - h: "Live R training"
      p: "New to R? Start with our <a href=\"https://www.appliedepi.org/tutorial/\">free interactive tutorials</a>. You can also join a live course in R and epidemiology."
      link: "Explore training →"
      href: "https://www.appliedepi.org/live/"
    - h: "Technical support"
      p: "Get expert help with your R code, your analyses and your data systems through our Support Desk."
      link: "Get support →"
      href: "mailto:contact@appliedepi.org"
    - h: "Community"
      p: "Join a global community of epidemiologists who share knowledge and answer each other's questions."
      link: "Join the community →"
      href: "https://community.appliedepi.org/"
  np_btn: "Visit appliedepi.org"
  np_btn_href: "https://www.appliedepi.org/"
  np_links: "appliedepi.org · contact@appliedepi.org"
  donate_label: "This handbook is free. A donation keeps it maintained."

