<script>
// Applied Epi redesign: progressive enhancement.
document.addEventListener('DOMContentLoaded', function () {

  // Interface strings, keyed by the BCP-47 tag in <html lang>: Japanese is ja and
  // Vietnamese is vi, not the folder spelling. A language with no entry reads English.
  // Only English was written by Applied Epi. The other seven are new, and a native
  // speaker MUST review them, as landing.yml asks for its new strings.
  var UI = {
    en: { dark: 'Dark mode', helpT: 'Need help with R?',
          helpP: 'Applied Epi offers live training, expert support, and a global community.',
          tutorials: 'Free R tutorials', course: 'Intro R course', support: 'R Support Desk', forum: 'Community forum' },
    fr: { dark: 'Mode sombre', helpT: 'Besoin d’aide avec R ?',
          helpP: 'Applied Epi propose des formations en direct, un support d’experts et une communauté mondiale.',
          tutorials: 'Tutoriels R gratuits', course: 'Cours d’introduction à R', support: 'Support Desk R', forum: 'Forum de la communauté' },
    es: { dark: 'Modo oscuro', helpT: '¿Necesitas ayuda con R?',
          helpP: 'Applied Epi ofrece formación en directo, soporte experto y una comunidad mundial.',
          tutorials: 'Tutoriales de R gratuitos', course: 'Curso de introducción a R', support: 'Support Desk de R', forum: 'Foro de la comunidad' },
    vi: { dark: 'Chế độ tối', helpT: 'Cần hỗ trợ về R?',
          helpP: 'Applied Epi cung cấp khóa học trực tuyến, hỗ trợ từ chuyên gia và một cộng đồng toàn cầu.',
          tutorials: 'Học phần R miễn phí', course: 'Khóa học R nhập môn', support: 'R Support Desk', forum: 'Diễn đàn cộng đồng' },
    ja: { dark: 'ダークモード', helpT: 'R でお困りですか？',
          helpP: 'Applied Epi は、ライブトレーニング、専門家によるサポート、世界規模のコミュニティを提供しています。',
          tutorials: '無料 R チュートリアル', course: 'R 入門コース', support: 'R Support Desk', forum: 'コミュニティフォーラム' },
    pt: { dark: 'Modo escuro', helpT: 'Precisa de ajuda com R?',
          helpP: 'A Applied Epi oferece treinamento ao vivo, suporte especializado e uma comunidade mundial.',
          tutorials: 'Tutoriais de R gratuitos', course: 'Curso introdutório de R', support: 'Support Desk de R', forum: 'Fórum da comunidade' },
    tr: { dark: 'Karanlık mod', helpT: 'R ile ilgili yardıma mı ihtiyacın var?',
          helpP: 'Applied Epi canlı eğitim, uzman desteği ve küresel bir topluluk sunar.',
          tutorials: 'Ücretsiz R eğitimleri', course: 'R’a giriş kursu', support: 'R Support Desk', forum: 'Topluluk forumu' },
    ru: { dark: 'Тёмная тема', helpT: 'Нужна помощь с R?',
          helpP: 'Applied Epi предлагает онлайн-обучение, экспертную поддержку и мировое сообщество.',
          tutorials: 'Бесплатные самоучители по R', course: 'Вводный курс по R', support: 'R Support Desk', forum: 'Форум сообщества' }
  };
  var ui = UI[(document.documentElement.lang || 'en').toLowerCase().split('-')[0]] || UI.en;

  // 0a) Publish the footer's live height so the sticky columns leave exactly enough
  //     room and stay pinned at the very bottom regardless of footer size.
  function syncLayoutVars() {
    var root = document.documentElement;
    // target the visible light-blue panel (.nav-footer), NOT the outer <footer> wrapper.
    // Growing the wrapper leaves the panel short and white shows below it.
    var f = document.querySelector('.nav-footer') || document.querySelector('footer.footer');
    var main = document.querySelector('main#quarto-document-content');
    if (f) f.style.minHeight = '';                       // reset before measuring
    var footerH = f ? Math.ceil(f.getBoundingClientRect().height) : 60;
    root.style.setProperty('--ael-footer-h', (footerH + 8) + 'px');
    // Natural content height = the vertical extent of main's CHILDREN. We must NOT
    // use main's own box height: as a grid item it stretches to the grid row, which
    // the tall sidebar itself inflates. Measuring that is circular (the sidebar's
    // height feeds back as the "content height" and the cap never bites).
    var mainH = 0;
    if (main) {
      var top = main.getBoundingClientRect().top, bottom = top;
      for (var i = 0; i < main.children.length; i++) {
        var cr = main.children[i].getBoundingClientRect();
        if (cr.height > 0 && cr.bottom > bottom) bottom = cr.bottom;
      }
      mainH = Math.ceil(bottom - top);
    }
    root.style.setProperty('--ael-content-h', mainH + 'px');
    // Cap the sidebar/TOC at min(viewport space, content height). The content term
    // stops the tall nav overhanging a short page (Welcome) and leaving dead space;
    // the viewport term keeps it scrollable-in-place on long chapters. We fill to just
    // shy of the viewport bottom (vh - appbar - 8), NOT minus the footer. The footer is
    // off-screen mid-page, so reserving room for it would leave dead white below the
    // nav. At the page bottom the sticky container already stops the box at the footer.
    var vh = window.innerHeight;
    var cap = Math.max(0, Math.min(vh - 60 - 8, mainH));
    root.style.setProperty('--ael-sidebar-maxh', cap + 'px');
    // Stretch the footer to the bottom of the viewport when the page is shorter than
    // the window. That leaves no white strip below it OR above it. Compute the page
    // height from known parts (app bar + content + footer), not from scrollHeight.
    // scrollHeight would still reflect the pre-cap tall sidebar this same tick.
    if (f) {
      var appbar = document.querySelector('.ael-appbar');
      var appbarH = appbar ? Math.ceil(appbar.getBoundingClientRect().height) : 60;
      var pageH = appbarH + mainH + footerH;             // sidebar is capped <= content
      var gap = vh - pageH;
      if (gap > 0) f.style.minHeight = (footerH + gap) + 'px';
    }
  }
  syncLayoutVars();
  window.addEventListener('resize', syncLayoutVars);
  window.addEventListener('load', syncLayoutVars);

  // 0) Build the full-width top app bar and relocate Quarto's brand/search/toggle into it.
  if (!document.querySelector('.ael-appbar')) {
    var bar = document.createElement('div');
    bar.className = 'ael-appbar';

    var logoImg = document.querySelector('.sidebar-logo img, .sidebar-header img');
    var logoSrc = logoImg ? logoImg.getAttribute('src') : '';
    var logoLink = logoImg ? logoImg.closest('a') : null;
    var homeHref = logoLink ? logoLink.getAttribute('href') : '#';
    var brand = document.createElement('a');
    brand.className = 'ael-brand';
    brand.href = homeHref || '#';
    brand.innerHTML = (logoSrc ? '<img src="' + logoSrc + '" alt="">' : '') +
      '<span><span class="ael-brand-t">Epi R Handbook</span>' +
      '<span class="ael-brand-s">by Applied Epi</span></span>';
    bar.appendChild(brand);

    var searchWrap = document.createElement('div');
    searchWrap.className = 'ael-appbar-search';
    var search = document.getElementById('quarto-search');
    if (search) searchWrap.appendChild(search);
    bar.appendChild(searchWrap);

    var tools = document.createElement('div');
    tools.className = 'ael-appbar-tools';
    // The real language switcher. inject_language_links.R writes
    // #languages-links-parent into the sidebar header after the render.
    // theme-ael.scss hides that header, so the element has to move here or no
    // reader ever sees it. Only CI injects it, so it is absent on a local
    // single-language render: guard on null and leave the bar one item shorter.
    var switcher = document.getElementById('languages-links-parent');
    if (switcher) tools.appendChild(switcher);
    var toggle = document.querySelector('.quarto-color-scheme-toggle');
    if (toggle) tools.appendChild(toggle);
    var dark = document.createElement('span');
    dark.className = 'ael-darklbl';
    dark.textContent = ui.dark;
    dark.addEventListener('click', function () { if (toggle) toggle.click(); });
    tools.appendChild(dark);
    bar.appendChild(tools);

    document.body.insertBefore(bar, document.body.firstChild);
  }

  // 0b) Sidebar: split "9  Title" into number + text so wrapped lines hang-indent
  //     (the wrapped line aligns with the title text, not under the number).
  document.querySelectorAll('#quarto-sidebar .sidebar-link .menu-text').forEach(function (m) {
    var mm = (m.textContent || '').match(/^(\d+)\s+(.*)$/);
    if (mm) {
      m.textContent = '';
      var num = document.createElement('span'); num.className = 'ael-navnum'; num.textContent = mm[1];
      var txt = document.createElement('span'); txt.className = 'ael-navtext'; txt.textContent = mm[2];
      m.appendChild(num); m.appendChild(txt);
      var link = m.closest('.sidebar-link'); if (link) link.classList.add('ael-numbered');
    }
  });

  var isChapter = document.querySelector('#title-block-header .chapter-number');

  // 1) Move the chapter's intro paragraph (the "lede") into the title block, under
  //    the chapter number and the title.
  if (isChapter) {
    var content = document.getElementById('quarto-document-content');
    var titleWrap = document.querySelector('#title-block-header .quarto-title');
    if (content && titleWrap) {
      var el = content.firstElementChild;
      while (el && el.tagName !== 'P' && el.tagName !== 'SECTION') el = el.nextElementSibling;
      if (el && el.tagName === 'P') {
        el.classList.add('ael-lede');
        titleWrap.appendChild(el);
      }
    }
  }

  // 2) Append a "Need help with R?" box beneath the on-this-page TOC.
  var toc = document.getElementById('TOC');
  if (toc) {
    var box = document.createElement('div');
    box.className = 'ael-navhelp';
    // The strings go in as text, never as markup, so a translation shows exactly as
    // written.
    function add(tag, cls, text, href) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (href) e.href = href;
      e.textContent = text;
      box.appendChild(e);
    }
    add('div', 'ael-navhelp-t', ui.helpT);
    add('p', 'ael-navhelp-p', ui.helpP);
    add('a', '', ui.tutorials + ' \u2192', 'https://appliedepi.org/resources/tutorials.html');
    add('a', '', ui.course + ' \u2192', 'https://appliedepi.org/training/training.html');
    add('a', '', ui.support + ' \u2192', 'https://appliedepi.org/support/support.html');
    add('a', '', ui.forum + ' \u2192', 'https://community.appliedepi.org/');
    toc.parentNode.insertBefore(box, toc.nextSibling);
  }

  // 3) Wrap each table of the chapter in a scrolling box, so a table wider than the
  //    column scrolls inside it and the page never scrolls sideways on a phone. A
  //    DataTables table already sits in its own scrolling wrapper.
  document.querySelectorAll('#quarto-document-content table').forEach(function (t) {
    if (t.closest('.dataTables_wrapper, .ael-tablewrap')) return;
    var wrap = document.createElement('div');
    wrap.className = 'ael-tablewrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
});
</script>
