# The Quarto book project for English, one of eight, one per language.
# It declares the language, the title and the chapter list.
# Render a chapter with content/en as the working directory.
# ../../ is the repository root: the banner, the theme and the images live there.

project:
  type: book
  output-dir: html_outputs

published-title: "Last updated"
lightbox: true  # a reader can click an image to see a larger version, caption included

lang: en

format:
  html:
    include-in-header:
      - ../../banner.html
    include-after-body:
      - ../../ael-extras.html
    theme:
      light: [../../theme-light.scss, ../../theme-ael.scss]
      dark: [../../theme-dark.scss, ../../theme-ael.scss]
    number-sections: true
    number-depth: 2
    toc-depth: 2
    toc-title: "Table of contents"
    page-layout: full
    grid:
      sidebar-width: 258px
      body-width: 1000px
      margin-width: 216px
      gutter-width: 2.4rem

# Quarto writes a Markdown copy of every page (<stem>.llms.md) for language models.
website:
  llms-txt: true
  # The summary and the Applied Epi part at the top of /llms.txt, in Markdown.
  # checks/site-index.py copies it there.
  description: |
    A free R reference guide for applied epidemiology and public health. Task-centered code you can use online or offline.

    Published by [Applied Epi](https://appliedepi.org/).

    Applied Epi is a nonprofit organisation created by and for applied epidemiologists. Our 80 team members are R experts with experience fighting outbreaks and building public health data systems. Over 1 million people use our free resources, and over 500 agencies choose Applied Epi to train and support their staff.

    Our [Introduction to R for Applied Epidemiology](https://appliedepi.org/training/training.html) course is trusted by the US CDC, the WHO, and 500+ other health agencies and Field Epidemiology Training Programs worldwide.

    Be notified of new materials, courses, and scholarship opportunities via [LinkedIn](https://www.linkedin.com/company/appliedepi/) or our [email list](https://docs.google.com/forms/d/e/1FAIpQLSdtk7Mg32lYQ3ucbIM-kIwIRxgRwDfG5TJHsVAbFjQ1i6fwiw/viewform).

    Contact: [appliedepi.org](https://appliedepi.org/) · [contact@appliedepi.org](mailto:contact@appliedepi.org)

    ## What Applied Epi offers

    - [Free tutorials and case studies](https://appliedepi.org/resources/resources.html): Get started with our free interactive tutorials or practice skills with our case studies.
    - [Live R training](https://appliedepi.org/training/training.html): Join a live course with 1-to-1 tutoring from experienced epidemiologists.
    - [R workflow support](https://appliedepi.org/support/support.html): Get expert help with your R code, your analyses and your data systems through our Support Desk.
    - [Community](https://community.appliedepi.org/): Join a global community of epidemiologists who share knowledge and answer each other's questions.

book:
  title: "The Epidemiologist R Handbook"
  search:
    type: textbox
  repo-url: https://github.com/appliedepi/epirhandbook
  sharing: ["twitter", "facebook", "linkedin"]
  sidebar:
    logo: "../../images/applied-epi-logo-2026.png"
    tools:
      - icon: twitter
        href: "https://twitter.com/appliedepi"
      - icon: linkedin
        href: "https://www.linkedin.com/company/appliedepi/"

  date: today
  date-format: "MMM D, YYYY"
  favicon: "../../images/applied-epi-logo-2026.png"
  # The footer image path MUST stay relative, like sidebar.logo above. The assemble
  # step rewrites ../../images/ to each page's own depth under site/<lang>/, and the
  # containment gate in build-deploy.yml then refuses a root-absolute /images/ path.
  page-footer:
    left: |
      Batra, Neale, et al. The Epidemiologist R Handbook. 2021.<br>[doi.org/10.5281/zenodo.4752646](https://doi.org/10.5281/zenodo.4752646)<br>CC BY-NC-SA 4.0
    right: |
      ![](../../images/applied-epi-footer.png){height=66px fig-alt="Applied Epi: technical partners for public health" .nolightbox}
  cookie-consent:
    type: implied
    style: simple
    palette: dark
  google-analytics:
    tracking-id: "G-QXDW878QLX"
    storage: cookies
    anonymize-ip: true

  chapters:
  - index.qmd
  - part: "About this book"
    chapters:
    - editorial_style.qmd
    - download.qmd
  - part: "Basics"
    chapters:
    - basics.qmd
    - transition_to_r.qmd
    - packages_suggested.qmd
    - r_projects.qmd
    - importing.qmd
  - part: "Data Management"
    chapters:
    - cleaning.qmd
    - dates.qmd
    - characters_strings.qmd
    - factors.qmd
    - pivoting.qmd
    - grouping.qmd
    - joining_matching.qmd
    - deduplication.qmd
    - iteration.qmd
  - part: "Analysis"
    chapters:
    - tables_descriptive.qmd
    - stat_tests.qmd
    - regression.qmd
    - missing_data.qmd
    - standardization.qmd
    - moving_average.qmd
    - time_series.qmd
    - epidemic_models.qmd
    - contact_tracing.qmd
    - survey_analysis.qmd
    - survival_analysis.qmd
    - gis.qmd
  - part: "Data Visualization"
    chapters:
    - tables_presentation.qmd
    - ggplot_basics.qmd
    - ggplot_tips.qmd
    - epicurves.qmd
    - age_pyramid.qmd
    - heatmaps.qmd
    - diagrams.qmd
    - combination_analysis.qmd
    - transmission_chains.qmd
    - phylogenetic_trees.qmd
    - interactive_plots.qmd
  - part: "Reports and dashboards"
    chapters:
    - rmarkdown.qmd
    - reportfactory.qmd
    - flexdashboard.qmd
    - shiny_basics.qmd
  - part: "Miscellaneous"
    chapters:
    - writing_functions.qmd
    - directories.qmd
    - collaboration.qmd
    - errors.qmd
    - help.qmd
    - network_drives.qmd
    - data_table.qmd
