# The Quarto book project for Русский, one of eight, one per language.
# It declares the language, the title and the chapter list.
# Render a chapter with content/ru as the working directory.
# ../../ is the repository root: the banner, the theme and the images live there.

project:
  type: book
  output-dir: html_outputs

published-title: "Last updated"
lightbox: true  # a reader can click an image to see a larger version, caption included

lang: ru

format:
  html:
    include-in-header:
      - ../../banner.html
    theme:
      light: cosmo
      dark: [darkly, ../../theme-dark.scss]

book:
  title: "Справочник эпидемиолога R"
  search:
    type: textbox
  repo-url: https://github.com/appliedepi/epirhandbook
  sharing: ["twitter", "facebook", "linkedin"]
  sidebar:
    logo: "../../images/Applied_Epi_logo.png"
    tools:
      - icon: twitter
        href: "https://twitter.com/appliedepi"
      - icon: linkedin
        href: "https://www.linkedin.com/company/appliedepi/"

  date: today
  date-format: "MMM D, YYYY"
  favicon: "../../images/Applied_Epi_logo.png"
  cookie-consent:
    type: implied
    style: simple
    palette: dark
  google-analytics:
    tracking-id: "G-QXDW878QLX"
    storage: cookies
    anonymize-ip: true

  chapters:
  - index.qmd
  - part: "Об этой книге"
    chapters:
    - editorial_style.qmd
    - data_used.qmd
  - part: "Основы"
    chapters:
    - basics.qmd
    - transition_to_r.qmd
    - packages_suggested.qmd
    - r_projects.qmd
    - importing.qmd
  - part: "Управление данными"
    chapters:
    - cleaning.qmd
    - dates.qmd
    - characters_strings.qmd
    - factors.qmd
    - pivoting.qmd
    - grouping.qmd
    - joining_matching.qmd
    - deduplication.qmd
    - iteration.qmd
  - part: "Анализ"
    chapters:
    - tables_descriptive.qmd
    - stat_tests.qmd
    - regression.qmd
    - missing_data.qmd
    - standardization.qmd
    - moving_average.qmd
    - time_series.qmd
    # epidemic_models is excluded from the build. Its sources are in ../../_excluded/.
    - contact_tracing.qmd
    - survey_analysis.qmd
    - survival_analysis.qmd
    - gis.qmd
  - part: "Визуализация данных"
    chapters:
    - tables_presentation.qmd
    - ggplot_basics.qmd
    - ggplot_tips.qmd
    - epicurves.qmd
    - age_pyramid.qmd
    - heatmaps.qmd
    - diagrams.qmd
    - combination_analysis.qmd
    - transmission_chains.qmd
    - phylogenetic_trees.qmd
    - interactive_plots.qmd
  - part: "Отчеты и информационные панели"
    chapters:
    - rmarkdown.qmd
    - reportfactory.qmd
    - flexdashboard.qmd
    - shiny_basics.qmd
  - part: "Разное"
    chapters:
    - writing_functions.qmd
    - directories.qmd
    - collaboration.qmd
    - errors.qmd
    - help.qmd
    - network_drives.qmd
    - data_table.qmd
