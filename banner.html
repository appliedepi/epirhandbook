<!-- No gtag here. Google Analytics is configured once, by book.google-analytics in
     content/<lang>/_quarto.yaml. A second gtag('config', ...) for the same id counts every
     pageview twice, and a raw gtag here fires before the cookie-consent banner that the
     Quarto key honours. -->

<!-- Applied Epi redesign: JetBrains Mono, the one webfont theme-light.scss and
     theme-dark.scss name. Text and headings use the stack of appliedepi.org, which
     loads no webfont. The subset list is explicit, so Russian and Vietnamese readers
     get the same mono face as everyone else. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&subset=latin,latin-ext,cyrillic,cyrillic-ext,vietnamese&display=swap" rel="stylesheet">
