<!-- No gtag here. Google Analytics is configured once, by book.google-analytics in
     content/<lang>/_quarto.yaml. A second gtag('config', ...) for the same id counts every
     pageview twice, and a raw gtag here fires before the cookie-consent banner that the
     Quarto key honours. -->

<!-- Applied Epi redesign: the three webfonts theme-light.scss and theme-dark.scss name.
     The subset list is explicit. A browser that supports unicode-range gets one block
     per subset from the css2 API. A browser that does not gets only the default subset,
     which is latin. Naming cyrillic and vietnamese keeps Russian and Vietnamese readers
     on the same faces as everyone else. No family here carries CJK:
     that falls to the system faces listed in the two token layers. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;700&subset=latin,latin-ext,cyrillic,cyrillic-ext,vietnamese&display=swap" rel="stylesheet">
