# Spanish translation rules. Read translation/all.yml first.
# Every regex is a Python re pattern. Check 24 applies it to one line at a time,
# case-insensitively unless the entry sets case: sensitive.
lang: es
ui_lang: es
register: "Address the reader as usted. Use the usted form of every verb, pronoun and possessive: usted, su, sus, le, lo. Never use tú. Never use voseo. A regex cannot separate the imperative usa from the third person R usa in the middle of a sentence. A native reader MUST still read the result."
banned:
  # case: sensitive, because "TI" (tecnologías de la información) is a correct noun.
  - id: es-tu-pronoun
    regex: '\b(?:[Tt]ú|[Tt]u|[Tt]us|ti|[Tt]e|[Cc]ontigo|[Tt]uy[oa]s?)\b'
    case: sensitive
    why: "These pronouns and possessives address the reader as tú."
    bad: "Guarde el archivo en tu ordenador."
    good: "Guarde el archivo en su ordenador. Consulte con su departamento de TI."
  - id: es-tu-verb
    regex: '\b(?:puedes|tienes|debes|quieres|necesitas|haces|sabes|usas|utilizas|verás|podrás|tendrás|deberás|querrás|harás|sabrás|estás|eres|vas|has|ves|sigues|encuentras|deseas|prefieres|intentas|obtienes|ejecutas|escribes|creas)\b'
    why: "These verb forms are the second person singular of tú."
    bad: "Puedes usar la función `filter()`."
    good: "Puede usar la función `filter()`."
  - id: es-voseo
    regex: '\b(?:vos|podés|podes|querés|tené|tenés|debés|sabés|hacé|hacés|usá|usás|fijate|mirá|poné|ponés|necesitás|decí|andá|vení|probá|instalá|ejecutá|creá|escribís|consultá|proporcioná|cliqueá|utilizá|utilizás|recordá|presioná|editá|comenzá|leé|introducí|añadí|escribí)\b'
    why: "These forms are voseo. The handbook uses usted."
    bad: "Si querés guardar el gráfico, usá `ggsave()`."
    good: "Si quiere guardar el gráfico, use `ggsave()`."
    more_bad: ["Dentro de `labs()` podes proporcionar cadenas de caracteres a estos argumentos:"]
    more_good: ["Dentro de `labs()` puede proporcionar cadenas de caracteres a estos argumentos:"]
  # ve and ven are also third person forms of ver ("se ve", "se ven").
  # The regex does not flag them after "se ". This is a choice the brief left open.
  - id: es-tu-imperative
    regex: '(?:\b(?:pon|haz|ten|sal|di)\b|(?<!\bse )\b(?:ve|ven)\b|\b\w*[áéíóú]\w*[ae]te\b|\b(?:recuérdalo|guárdalo|pruébalo|ejecútalo|úsalo|cámbialo|escríbelo|léelo|ábrelo|instálalo|revísalo|compruébalo)\b)'
    why: "These imperatives are tú forms only. The enclitic forms with -ate or -ete (asegúrate, fíjate) are also tú forms. The usted forms are asegúrese and fíjese."
    bad: "Asegúrate de que el paquete está instalado y pon el nombre entre comillas."
    good: "Asegúrese de que el paquete está instalado y ponga el nombre entre comillas. Así es como se ve el gráfico."
  # These forms are also the third person singular ("R usa", "la función crea").
  # The regex flags them only at the start of a line, a list item, a heading,
  # a sentence or a clause (after , ; :).
  - id: es-tu-imperative-start
    regex: '(?:^\s*(?:[-*+]\s+|\d+[.)]\s+|#+\s+)?|[.!?;:,]\s+)[¡¿*_]*(?:usa|utiliza|consulta|ejecuta|mira|crea|escribe|instala|revisa|abre|guarda|elige|selecciona|añade|agrega|intenta|recuerda|observa|considera|cambia|vuelve|imagina|piensa|recibe|empieza|descubre|consigue)\b'
    why: "At the start of a sentence, a clause or a list item, these verbs are tú imperatives. The usted forms end in -e or -a: use, consulte, ejecute, escriba."
    bad: "Primero, consulta la página de ayuda."
    good: "Primero, consulte la página de ayuda. La función `mutate()` crea una columna nueva."
glossary:
  - en: "chunk"
    use: "bloque de código"
    never: ["trozo", "trozos", "chunk", "chunks", "fragmento", "fragmentos"]
    note: "Write it in sentence case. Keep chunk options as literal code. The phrase trozos de texto means pieces of text and is not a code chunk."
  - en: "or"
    use: "o"
    never: ["or"]
    note: "Translate the word or between two code spans in a table cell."
examples:
  - bad: "Si tienes dudas, consulta la página de ayuda."
    good: "Si tiene dudas, consulte la página de ayuda."
  - bad: "Asegúrate de que tu código se ejecuta."
    good: "Asegúrese de que su código se ejecuta."
  - bad: "Si querés guardar el gráfico, usá `ggsave()`."
    good: "Si quiere guardar el gráfico, use `ggsave()`."
  - bad: "Escriba el código en un trozo de R."
    good: "Escriba el código en un bloque de código de R."
  - bad: "`rep(1:3, 2)` or `rep(c(\"a\", \"b\", \"c\"), 3)`"
    good: "`rep(1:3, 2)` o `rep(c(\"a\", \"b\", \"c\"), 3)`"
review_log:
  - date: "2026-11-11"
    finding: "Address the reader as usted. Never use tú."
    rule_id: es-tu-pronoun
  - date: "2026-11-11"
    finding: "Remove the voseo."
    rule_id: es-voseo
  - date: "2026-11-11"
    finding: "Write the interface strings in landing.yml and ael-extras.html in usted."
    rule_id: es-tu-verb
  - date: "2026-11-11"
    finding: "An R code chunk is a bloque de código."
    rule_id: chunk
  - date: "2026-11-11"
    finding: "Translate the or in the useful functions table of basics.qmd."
    rule_id: or
  - date: "2026-11-12"
    finding: "The voseo rule missed the unaccented podes. The phase 3 review found it at content/es/ggplot_basics.qmd:585."
    rule_id: es-voseo
