# Russian translation rules. Read translation/all.yml first.
# Every regex is a Python re pattern. Check 24 applies it to one line at a time,
# case-insensitively unless the entry sets case: sensitive.
lang: ru
ui_lang: ru
register: "Address the reader as вы. Use the second person plural of every verb. Never use ты or any form of твой."
banned:
  - id: ru-ty-pronoun
    regex: '\b(?:ты|тебя|тебе|тобой|тобою)\b'
    why: "These pronouns address the reader as ты."
    bad: "Если ты хочешь сохранить график, используй `ggsave()`."
    good: "Если вы хотите сохранить график, используйте `ggsave()`."
  - id: ru-ty-possessive
    regex: '\bтво(?:й|я|ё|е|и|его|ей|ему|им|их|ю|ими|ём|ем)\b'
    why: "These possessives address the reader as ты."
    bad: "Сохраните твой скрипт."
    good: "Сохраните ваш скрипт."
glossary:
  - en: "or"
    use: "или"
    never: ["or"]
    note: "Translate the word or between two code spans in a table cell."
examples:
  - bad: "Если ты хочешь сохранить график, используй `ggsave()`."
    good: "Если вы хотите сохранить график, используйте `ggsave()`."
review_log:
  - date: "2026-11-11"
    finding: "Translate the or in the useful functions table of basics.qmd."
    rule_id: or
