# Vietnamese translation rules. Read translation/all.yml first.
lang: vn
ui_lang: vi
register: "Address the reader as bạn. The handbook uses bạn as the neutral form. The formal quý vị addresses an audience and reads oddly in a handbook. A native reader MUST confirm bạn."
banned: []
why_empty: "No informal form of address is banned. The handbook keeps bạn until a native reader confirms it or names a form to ban."
glossary:
  - en: "or"
    use: "hoặc"
    never: ["or"]
    note: "Translate the word or between two code spans in a table cell."
examples:
  - bad: "`rep(1:3, 2)` or `rep(c(\"a\", \"b\", \"c\"), 3)`"
    good: "`rep(1:3, 2)` hoặc `rep(c(\"a\", \"b\", \"c\"), 3)`"
review_log:
  - date: "2026-11-11"
    finding: "Translate the or in the useful functions table of basics.qmd."
    rule_id: or
