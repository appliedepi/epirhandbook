# Japanese translation rules. Read translation/all.yml first.
# Every regex is a Python re pattern. Check 24 applies it to one line at a time,
# case-insensitively unless the entry sets case: sensitive.
lang: jp
ui_lang: ja
register: "Write prose in the polite form, with です and ます. Do not use a plain imperative or a command to the reader. The polite instruction なさい is allowed. The plain dictionary form, for example である and ない, is correct in a table cell, a list item and a code comment. The rules below do not ban it."
banned:
  # Each regex is anchored to the end of a sentence or a clause.
  # jp-shiro has a lookbehind on む, because むしろ、 (rather) is correct prose.
  # A command with しろ before 、 is found, for example 勉強もしろ、.
  - id: jp-shiro
    regex: '(?<!む)しろ(?=[。！!、]|$)'
    why: "The ending しろ is a plain command to the reader."
    bad: "パッケージをインストールしろ。"
    good: "パッケージをインストールしてください。"
    more_bad: ["勉強もしろ。", "勉強もしろ、そして確認します。"]
    more_good: ["むしろ、こちらの方が速いです。", "おもしろい結果です。"]
  # The lookbehind on いずれに keeps the concessive いずれにせよ、 (in any case).
  - id: jp-seyo
    regex: '(?<!いずれに)せよ(?=[。！!、]|$)'
    why: "The ending せよ is a written command to the reader."
    bad: "ヘルプページを参照せよ。"
    good: "ヘルプページを参照してください。"
    more_bad: ["明確にせよ。"]
    more_good: ["いずれにせよ、結果は同じです。"]
  - id: jp-tekure
    regex: 'てくれ(?=[。！!、]|$)'
    why: "A sentence or a clause that ends in てくれ is a plain request to the reader."
    bad: "ファイルを保存してくれ。"
    good: "ファイルを保存してください。"
    more_bad: ["確認してくれ、"]
    more_good: ["この関数は日付を変換してくれます。"]
glossary:
  - en: "or"
    use: "または"
    never: ["or"]
    note: "Translate the word or between two code spans in a table cell."
examples:
  - bad: "パッケージをインストールしろ。"
    good: "パッケージをインストールしてください。"
review_log:
  - date: "2026-11-11"
    finding: "Translate the or in the useful functions table of basics.qmd."
    rule_id: or
