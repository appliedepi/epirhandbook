# French translation rules. Read translation/all.yml first.
# Every regex is a Python re pattern. Check 24 applies it to one line at a time,
# case-insensitively unless the entry sets case: sensitive.
lang: fr
ui_lang: fr
register: "Address the reader as vous. Use votre and vos for the possessive. Never use tu, te, toi, ton, ta or tes to address the reader."
banned:
  - id: fr-tu-pronoun
    regex: "\\b(?:tu|toi|te)\\b|\\bt'"
    why: "These pronouns address the reader as tu."
    bad: "Si tu veux importer les données, utilise `import()`."
    good: "Si vous voulez importer les données, utilisez `import()`."
  # case: sensitive, because TA is a variable name in survival_analysis.qmd.
  - id: fr-tu-possessive
    regex: '\b(?:[Tt]on|[Tt]a|[Tt]es)\b'
    case: sensitive
    why: "These possessives address the reader as tu."
    bad: "# importer ton jeu de données"
    good: "# importer votre jeu de données, avec la colonne TA"
glossary:
  - en: "or"
    use: "ou"
    never: ["or"]
    note: "Translate the word or between two code spans in a table cell."
examples:
  - bad: "Si tu veux importer les données, utilise `import()`."
    good: "Si vous voulez importer les données, utilisez `import()`."
  - bad: "# ajoute ta donnée dans le graphique"
    good: "# ajoutez vos données dans le graphique"
review_log:
  - date: "2026-11-11"
    finding: "Translate the or in the useful functions table of basics.qmd."
    rule_id: or
