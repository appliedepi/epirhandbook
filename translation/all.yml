# Translation rules for every language of the handbook.
# Read this file and translation/<lang>.yml before you translate.
# Check 24 (checks/check-translation-rules.py) reads both files.
rules:
  - id: keep-identifiers
    text: "Keep R identifiers unchanged. This includes object names, function names, argument names, package names and file paths."
  - id: keep-chunk-options
    text: "Keep chunk options unchanged, for example `eval=F`, `echo=FALSE` and `#| label:`."
  - id: keep-code
    text: "Keep executable code unchanged. Change only the comments inside a code chunk."
  - id: translate-prose-and-comments
    text: "Translate prose and code comments only. Do not translate code, output or literal strings that the code uses."
  - id: keep-table-structure
    text: "Keep the table syntax unchanged. A pipe table or a grid table MUST have the same rows and the same cells as the English table."
  - id: keep-table-markup
    text: "Keep the separator lines and the bold markers of a table balanced. Do not put a pipe table inside the rules of a simple table."
  - id: all-placeholder-code-span
    text: "Put a placeholder such as `<name>` or `<commit_hash>` in a code span. Outside a code span, the browser reads it as an HTML tag and does not show it. Check 26 (checks/check-raw-html.py) finds such a placeholder."
  - id: all-code-in-code-span
    text: "Put code in prose in a code span, for example `summary(dataset)` and `table()`. Never put it in quotes, as in \"summary(dataset)\" or 'table()'."
  - id: all-untranslated-line
    text: "Translate every prose line, heading and table row. Check 24 fails a line that is identical to a line of the English chapter and holds four or more words of letters. It does not count the words of link text, code spans, math and quoted R output. It does not count a table cell that names a file format or a package. checks/check-translation-rules.py gives the full definition. Some lines are correct as they are, for example a reference-list citation, an author list or a proper name. Such a line needs a row in checks/translation-exceptions.tsv with its reason."
feedback_loop: "Each reviewer finding becomes one rule, one example and, where a regex can check it, one failing fixture. Add all three in one commit. Record the finding in the review_log of translation/<lang>.yml, with the id of its rule."
# banned and examples apply to every language except English.
banned:
  # case: sensitive, because the English word is lowercase in the tables.
  # Check 24 reads each inline code span as one NUL character (\x00), so the regex
  # matches NUL, not the backticks. The second form is or at the end of a line of a
  # grid-table cell, where the next code span is on the next line of the cell.
  - id: all-untranslated-or
    regex: '\x00[ \t]+or(?:[ \t]+\x00|[ \t]*\|)'
    case: sensitive
    why: "The English word or between two code spans is prose. Translate it."
    bad: "`rep(1:3, 2)` or `rep(c(\"a\", \"b\", \"c\"), 3)`"
    good: "`rep(1:3, 2)` o `rep(c(\"a\", \"b\", \"c\"), 3)`"
    more_bad: ["| répéter x, n fois  | rep(x, ntimes) | `rep(1:3, 2)` or             |"]
    more_good:
      - "| répéter x, n fois  | rep(x, ntimes) | `rep(1:3, 2)` ou             |"
      - "Use `x` or more values."
      - "Vous pouvez utiliser `mean()`, or `median()` résiste mieux aux valeurs extrêmes."
  - id: all-esquisse
    regex: '\bequisse\b'
    why: "The package name is esquisse. equisse is a typo."
    bad: "Apuntar y clicar en **ggplot2** con **equisse**"
    good: "Apuntar y clicar en **ggplot2** con **esquisse**"
    more_bad: ["### İşaretle ve tıkla **ggplot2** ile **Equisse** {.unnumbered}"]
examples:
  - bad: "`rep(1:3, 2)` or `rep(c(\"a\", \"b\", \"c\"), 3)`"
    good: "`rep(1:3, 2)` ou `rep(c(\"a\", \"b\", \"c\"), 3)`"
review_log:
  - date: "2026-11-12"
    finding: "The or rule missed fr basics.qmd:1695. There, or ends a line of a grid-table cell, and the next code span is on the next line."
    rule_id: all-untranslated-or
  - date: "2026-11-12"
    finding: "The ggplot_tips.qmd heading of every language wrote equisse for the package esquisse (issue 466, item 6)."
    rule_id: all-esquisse
  - date: "2026-11-12"
    finding: "Translated chapters held lines identical to the English line. The phase 7 detector found 91 such lines in 7 languages on commit 5ba3beb5 (issue 466, item 4)."
    rule_id: all-untranslated-line
  - date: "2026-11-12"
    finding: "Placeholders such as <name>, <file> and <message> were raw HTML in the prose of all 8 languages, so the browser did not show them (issue 466, item 1)."
    rule_id: all-placeholder-code-span
  - date: "2026-11-12"
    finding: "tr transition_to_r.qmd put code in quotes, for example \"summary(dataset)\" and \"skim(dataset)\" (issue 466, item 3). This rule has no regex. A regex for a quoted call finds 255 lines on the real tree, and 241 of them are tr prose."
    rule_id: all-code-in-code-span
