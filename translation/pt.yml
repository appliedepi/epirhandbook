# Portuguese translation rules. Read translation/all.yml first.
# Every regex is a Python re pattern. Check 24 applies it to one line at a time,
# case-insensitively unless the entry sets case: sensitive.
lang: pt
ui_lang: pt
register: "Address the reader as você. Use seu, sua, seus and suas for the possessive. Never use tu or the verb forms of tu."
banned:
  - id: pt-tu-pronoun
    regex: '\b(?:tu|teu|tua|teus|tuas|contigo)\b'
    why: "These pronouns and possessives address the reader as tu."
    bad: "Salve o arquivo no teu computador."
    good: "Salve o arquivo no seu computador."
  - id: pt-tu-verb
    regex: '\b(?:podes|tens|queres|deves|sabes)\b'
    why: "These verb forms are the second person singular of tu."
    bad: "Sentenças lógicas mais complexas podes ser construídas usando parênteses."
    good: "Sentenças lógicas mais complexas podem ser construídas usando parênteses. Você pode usar `filter()`."
glossary:
  - en: "or"
    use: "ou"
    never: ["or"]
    note: "Translate the word or between two code spans in a table cell."
examples:
  - bad: "Sentenças lógicas mais complexas podes ser construídas."
    good: "Sentenças lógicas mais complexas podem ser construídas."
  - bad: "Salve o arquivo no teu computador."
    good: "Salve o arquivo no seu computador."
review_log:
  - date: "2026-11-11"
    finding: "In cleaning.qmd, podes is a typo for podem."
    rule_id: pt-tu-verb
  - date: "2026-11-11"
    finding: "Translate the or in the useful functions table of basics.qmd."
    rule_id: or
