# Turkish translation rules. Read translation/all.yml first.
# Every regex is a Python re pattern. Check 24 applies it to one line at a time,
# case-insensitively unless the entry sets case: sensitive.
lang: tr
ui_lang: tr
register: "Address the reader as siz. Use the siz form of every verb, for example kullanın, yükleyin and yapabilirsiniz. Never use sen. A regex cannot find a bare imperative such as kullan or oluştur, because the same word is also a menu label or a dictionary form. A regex also cannot find the second person singular possessive, for example kütüphanen. A native reader MUST read the text for these forms."
banned:
  - id: tr-sen-pronoun
    regex: '\b(?:sen|sana|seni|senin|sende|senden|seninle|sence)\b'
    why: "These pronouns address the reader as sen."
    bad: "İnsanlar sana yardım etmek istiyor."
    good: "İnsanlar size yardım etmek istiyor."
  - id: tr-sen-ability
    regex: '\b\w+[ae]bilir(?:sin|sın)\b'
    why: "The ending -ebilirsin or -abilirsin is the sen form. The siz form is -ebilirsiniz or -abilirsiniz."
    bad: "Bunu fark etmeyebilirsin."
    good: "Bunu fark etmeyebilirsiniz."
  - id: tr-sen-necessity
    regex: '\b\w+m[ae]l[ıi]s[ıi]n\b'
    why: "The ending -malısın or -melisin is the sen form. The siz form is -malısınız or -melisiniz."
    bad: "Bir örnek vermelisin."
    good: "Bir örnek vermelisiniz."
  - id: tr-sen-conditional
    regex: '\b\w+[ıiuüae]rs[ae]n\b'
    why: "The ending -ırsan or -ersen is the sen form of the conditional. The siz form is -ırsanız or -erseniz."
    bad: "Eğer yanlış olanı kullanırsan, hata alırsınız."
    good: "Eğer yanlış olanı kullanırsanız, hata alırsınız."
  - id: tr-sen-present
    regex: '\b\w+(?:[ıiuü]yor|[ae]c[ae]k)s(?:un|ın|in|ün)\b'
    why: "The endings -iyorsun and -eceksin are sen forms. The siz forms are -iyorsunuz and -eceksiniz."
    bad: "Şimdi yeni bir sütun oluşturuyorsun."
    good: "Şimdi yeni bir sütun oluşturuyorsunuz."
glossary:
  - en: "or"
    use: "veya"
    never: ["or"]
    note: "Translate the word or between two code spans in a table cell."
examples:
  - bad: "İnsanlar sana yardım etmek istiyor."
    good: "İnsanlar size yardım etmek istiyor."
  - bad: "Veri kümesini yükle."
    good: "Veri kümesini yükleyin."
review_log:
  - date: "2026-11-11"
    finding: "Translate the or in the useful functions table of basics.qmd."
    rule_id: or
