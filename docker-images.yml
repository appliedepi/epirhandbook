# docker-images.yml: the chapter-to-image manifest for CI rendering.
#
# HAND-MAINTAINED. Nothing generates this file; edit it directly.
#
# One row per BOOK CHAPTER, which is a stem such as "time_series". A row is
# not per language. A chapter's translations are content/<lang>/<stem>.qmd,
# one file per language, and they share the English source's R code. So every
# language of a chapter renders with the same image.
#
# Do not add a language axis here. The language list lives in languages.yml,
# and build_all_chapters.sh reads it from there. Nothing else declares which
# languages ship.
#
# "index" is a chapter too. It renders content/<lang>/index.qmd, with the
# basics image, which covers it.
#
# SINCE 2.8, MANY STEMS SHARE ONE IMAGE. v2.7 published 49 per-chapter images.
# 2.8 and 2.9 publish six GROUP images plus a monolith. Five groups each cover
# one part of the book. The basics image covers three things: the "Basics"
# part, the "About this book" part, and index.
#
# So a row's image is its group's image. Editing one row's tag pins that
# CHAPTER, not its whole group. The other chapters that share the image are
# unaffected, because this file is the only thing that maps a chapter to an
# image.
#
# TO PIN ONE CHAPTER BACK to an older package set, change only that row's
# image, for example:
#   - stem: basics
#     image: epirhandbook-basics:2.7      # deliberately pinned back
#
# This file must list EXACTLY the stems that content/en/_quarto.yaml declares
# under `book.chapters`, including the stems nested inside a part. No more,
# no fewer. build_all_chapters.sh checks both directions and fails the build
# on either; see its check_manifest_covers_book().

registry: ghcr.io/appliedepi/aedockerpublic

chapters:
