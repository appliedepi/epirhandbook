# docker-images.yml -- the chapter -> Docker image manifest for CI rendering.
#
# HAND-MAINTAINED. Nothing generates this file; edit it directly.
#
# One row per BOOK CHAPTER (a stem, e.g. "time_series"), not per language:
# a chapter's translations (chapters/time_series.fr.qmd, .es.qmd, ...) share
# the same R code as the English source, so they render with the same image.
# Do not add a language axis here -- the language list lives in _quarto.yml
# (babelquarto.mainlanguage / babelquarto.languages) and is read from there
# by build_all_chapters.sh, never duplicated in this file.
#
# "index" is a chapter too: it renders index.qmd (at the repo root, not
# under chapters/) with image epirhandbook-index.
#
# TO PIN ONE CHAPTER BACK to an older package set, change only that row's
# image tag, e.g.:
#   - stem: basics
#     image: epirhandbook-basics:2.6      # deliberately pinned back
# Every other chapter keeps rendering at its own tag, independent of this
# one's pin.
#
# This file must list EXACTLY the chapters _quarto.yml's `book.chapters`
# declares (including parts nested under `chapters:`) -- no more, no fewer.
# A book chapter with no row here is treated as a missing manifest entry by
# build_all_chapters.sh and fails the build; see that script's
# check_manifest_covers_book().

registry: ghcr.io/appliedepi/aedockerpublic

chapters:
  - stem: index
    image: epirhandbook-index:2.7
